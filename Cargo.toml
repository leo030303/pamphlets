[package]
name = "pamphlets"
version = "0.1.0"
authors = ["Leo Ring <leoring03@gmail.com>"]
edition = "2024"
publish = false
# rust-version = "1.92"

[profile.release]
lto = true

[dependencies]
ashpd = {version = "0.13.13", features = ["file_chooser"]}
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
pandoc = "0.8.11"
poppler-rs = "0.26.0"
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_49"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
